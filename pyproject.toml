[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pm-model-harness"
version = "0.3.0a1"
description = "A delegation-first, learning-visible harness for auditable specialist-model training."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Wang Hui"}
]
dependencies = [
  "scikit-learn>=1.5,<2.0"
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0"
]
test = [
  "httpx2>=2.0,<3.0"
]

[project.urls]
Homepage = "https://github.com/wanghui2323/ai-pm-model-harness"
Repository = "https://github.com/wanghui2323/ai-pm-model-harness"
Issues = "https://github.com/wanghui2323/ai-pm-model-harness/issues"

[project.scripts]
small-model-harness = "model_harness.cli:main"

[tool.setuptools.packages.find]
include = ["model_harness*"]

[tool.setuptools.package-data]
model_harness = ["web/*.html", "web/*.css", "web/*.js"]
