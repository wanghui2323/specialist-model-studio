[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "specialist-model-studio"
version = "1.0.0rc1"
description = "A conversation-native studio for evidence-backed specialist-model research, training, evaluation, and delivery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Wang Hui"}
]
dependencies = [
  "certifi>=2024.8.30",
  "huggingface-hub>=0.34,<1.0",
  "onnxruntime>=1.20,<2.0",
  "Pillow>=11.0,<13.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "websockets>=15,<16"
]
test = [
  "httpx2>=2.0,<3.0"
]

[project.urls]
Homepage = "https://github.com/wanghui2323/specialist-model-studio"
Repository = "https://github.com/wanghui2323/specialist-model-studio"
Issues = "https://github.com/wanghui2323/specialist-model-studio/issues"

[project.scripts]
specialist-model-studio = "model_harness.cli:main"
small-model-harness = "model_harness.cli:main"

[tool.setuptools.packages.find]
include = ["model_harness*"]

[tool.setuptools.package-data]
model_harness = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
