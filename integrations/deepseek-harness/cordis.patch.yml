- id: credentials
  config:
    # Session, settings and runtime state remain under the isolated DSH_HOME.
    # Only the credentials provider is linked to the launcher-selected store;
    # credential values are never copied into this patch or process tools.
    path: !!js process.env.MODEL_HARNESS_DSH_CREDENTIALS_FILE || dshHomePath('.credentials.yaml')

- insert:
    - id: specialist-model-studio
      name: specialist-model-studio-dsh-plugin

- id: agent-presets
  config:
    # The repository-managed model-training preset owns the five role-scoped
    # delegation tools. Providers and the continuable registry stay host-plane.
    default: model-training
    includeUserRoot: true
