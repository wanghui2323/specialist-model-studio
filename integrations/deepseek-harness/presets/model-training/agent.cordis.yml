# Focused model-training preset for DeepSeek Harness. Domain tools and the
# training system-prompt section are registered globally by this repository's
# plugin bundle; this preset supplies the agent-plane persona and small set of
# general conversation controls without exposing shell or generic file editing.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Model Training Agent powered by {{model}}. Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
