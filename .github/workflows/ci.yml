name: v0.7 beta checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-full-suite:
    name: python-full-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check -e '.[server,test]'
      - name: Run Python suite
        run: python -m unittest discover -s tests -v

  deepseek-harness-suite:
    name: deepseek-harness-suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/deepseek-harness
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run adapter suite
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
