name: release candidate checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-full-suite:
    name: python-full-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run Python suite
        run: python -m unittest discover -s tests -v

  deepseek-harness-suite:
    name: deepseek-harness-suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/deepseek-harness
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run adapter suite
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
