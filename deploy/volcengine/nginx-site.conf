limit_req_zone $binary_remote_addr zone=sms_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sms_sse_connection:10m;

server {
    listen 80;
    listen [::]:80;
    server_name studio.learnbuddy.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.learnbuddy.top;

    ssl_certificate /etc/letsencrypt/live/studio.learnbuddy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.learnbuddy.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SMS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Allow an explicitly reviewed preview IP to enter without relying on a
    # browser-native Basic Auth dialog. Other sources still need Basic Auth.
    satisfy any;
    auth_basic "Specialist Model Studio private preview";
    auth_basic_user_file /etc/nginx/.htpasswd-specialist-model-studio;
    include /etc/nginx/snippets/specialist-model-studio-allow.conf;

    client_max_body_size 210m;
    client_body_timeout 120s;
    send_timeout 3600s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Accel-Buffering "no" always;

    location ^~ /app/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        expires 1h;
    }

    location ~ ^/tasks/[^/]+/conversation/stream$ {
        # Long-lived SSE connections must not consume the ordinary API budget.
        limit_conn sms_sse_connection 8;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=sms_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Required for streamed Agent/tool events and long-running turns.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
